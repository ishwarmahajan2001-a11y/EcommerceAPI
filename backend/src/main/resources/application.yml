server:
  port: 8080

spring:
  application:
    name: ecommerce-api

  datasource:
    url: jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop        # dev only: recreates schema on each start
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false            # best practice: avoid lazy-loading in the view layer

# Application-specific settings
app:
  jwt:
    # For local learning only. In production, load from AWS Secrets Manager / env var.
    secret: ${JWT_SECRET:change-me-this-is-a-very-long-dev-only-secret-key-min-256-bits!!}
    expiration-ms: 3600000         # 1 hour

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
